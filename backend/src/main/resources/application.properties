server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wildlife}${DB_PARAMS:?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

app.security.jwt-secret=${JWT_SECRET:}
app.security.cookie-secure=${AUTH_COOKIE_SECURE:false}