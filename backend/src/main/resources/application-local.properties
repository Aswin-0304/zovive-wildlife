# Local development fallback only. Production/default profile remains MySQL.
spring.datasource.url=jdbc:h2:file:./data/wildlife-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.security.cookie-secure=${AUTH_COOKIE_SECURE:false}
